name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'agus_ojisan'
        required: true
        default: 'agus_ojisan'
      agent_description:
        description: 'agus_ojisan agen'
        required: true
        default: 'agus_ojisan AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (https://github.com/agusilham/verified-agent-identity)
        uses: actions/checkout@v3

      - name: Checkout verified‑agent‑identity skill
        uses: actions/checkout@v3
        with:
          repository: BillionsNetwork/verified-agent-identity
          path: verified-agent-identity

      - name: Install skill dependencies
        run: |
          cd verified-agent-identity
          npm install shell-quote @iden3/js-iden3-auth @0xpolygonid/js-sdk ethers uuid cross-fetch

      - name: Create new Ethereum Identity
        run: |
          cd verified-agent-identity/scripts
          node createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          cd verified-agent-identity/scripts
          node manualLinkHumanToAgent.js \
            --challenge '{"name": "${{ github.event.inputs.agent_name }}", "description": "${{ github.event.inputs.agent_description }}"}'
