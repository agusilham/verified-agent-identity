name: Verify Human Identity

# -------------------------------------------------
# 1️⃣  PEMICU (event trigger)
# -------------------------------------------------
on:
  workflow_dispatch:          # <-- ini memberi tombol “Run workflow” di UI GitHub
    inputs:
      agent_name:
        description: 'agus_ojisan'
        required: true
        default: 'agus_ojisan'
      agent_description:
        description: 'agus_ojisan AI Agent'
        required: true
        default: 'agus_ojisan AI Agent'

# -------------------------------------------------
# 2️⃣  JOB yang akan dijalankan
# -------------------------------------------------
jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js \
            --challenge '{"name": "${{ github.event.inputs.agent_name }}", "description": "${{ github.event.inputs.agent_description }}"}'
